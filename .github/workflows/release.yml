name: CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check distribution files
        shell: pwsh
        run: |
          foreach ($file in @('src/purchase-macros.ks', 'README.md', 'README.ru.md')) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing or empty: $file" }
          }
          if (Test-Path macros) { throw 'Personal macros must not be committed' }
      - name: Verify macro storage
        shell: pwsh
        run: ./tests/storage.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package distribution
        shell: pwsh
        run: Copy-Item src/purchase-macros.ks purchase-macros.ks
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" purchase-macros.ks --generate-notes
